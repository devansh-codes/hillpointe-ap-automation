[project]
name = "ap-automation"
version = "0.1.0"
description = "Hillpointe AP invoice automation: Claude extracts facts, deterministic rules decide."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.9",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "rapidfuzz>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4.2"]

[project.scripts]
ap = "ap_automation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
